name: Solid 3D - regressao estatica
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe, controles e regressoes conhecidas
        run: node tests/check.mjs
      - name: Instalar navegador de testes (sem alterar dependencias do site)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
        timeout-minutes: 6
      - name: Testar interface e modelagem em Chromium
        run: node tests/browser.mjs
        timeout-minutes: 4
